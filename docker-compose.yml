services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  node_app_1:
    build: .
    env_file:
      - .env
    environment:
      - PORT=${NODE_INTERNAL_PORT}
      - DOCKER_ENV=true
      - REDIS_URL=redis://redis_server:${REDIS_INTERNAL_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis_server:
        condition: service_started

  node_app_2:
    build: .
    env_file:
      - .env
    environment:
      - PORT=${NODE_INTERNAL_PORT}
      - DOCKER_ENV=true
      - REDIS_URL=redis://redis_server:${REDIS_INTERNAL_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis_server:
        condition: service_started

  redis_server:
    image: redis:alpine
    expose:
      - "6379"

  nginx_lb:
    image: nginx:alpine
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    ports:
      - "80:80"
    depends_on:
      - node_app_1
      - node_app_2

volumes:
  pgdata:
